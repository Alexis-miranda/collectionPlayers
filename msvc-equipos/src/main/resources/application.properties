spring.application.name=msvc-equipos

server.port=8006
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/msvcEquipos
spring.datasource.username=postgres
spring.datasource.password=sasa
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.generate-ddl=true
logging.level.org.hibernate.SQL=debug

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Service-to-service URL can be overridden without changing source code.
services.jugadores.base-url=${JUGADORES_SERVICE_URL:http://localhost:8005}

spring.jpa.open-in-view=false
