spring.application.name=msvc-equipos

server.port=${SERVER_PORT:8006}
spring.datasource.url=${TEAMS_DB_URL:jdbc:postgresql://localhost:5432/msvcEquipos}
spring.datasource.username=${TEAMS_DB_USERNAME:postgres}
spring.datasource.password=${TEAMS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:warn}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
services.jugadores.base-url=${JUGADORES_SERVICE_URL:http://localhost:8005}
spring.jpa.open-in-view=false
