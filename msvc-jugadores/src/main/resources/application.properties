spring.application.name=msvc-jugadores
server.port=${SERVER_PORT:8005}

spring.datasource.url=${PLAYERS_DB_URL:jdbc:postgresql://localhost:5432/msvcJugadores}
spring.datasource.username=${PLAYERS_DB_USERNAME:postgres}
spring.datasource.password=${PLAYERS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=Players Service
info.app.description=Player profile management API
